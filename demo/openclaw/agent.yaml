apiVersion: v1
kind: Pod
metadata:
  name: agent
  labels:
    app: agent
spec:
  nodeName: aks-nodepool1-48531884-vmss000000
  runtimeClassName: kata-preview
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
  containers:
  - name: openclaw
    image: ghcr.io/openclaw/openclaw:2026.3.23
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    env:
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: anthropic-api-key
          key: ANTHROPIC_API_KEY
    - name: OPENCLAW_GATEWAY_TOKEN
      value: "dummy-token-for-sandbox"
    - name: OPENCLAW_CONFIG_PATH
      value: "/etc/openclaw/openclaw.json"
    command:
      - node
      - dist/index.js
      - gateway
      - --bind=lan
      - --port
      - "18789"
      - --allow-unconfigured
      - --verbose
    ports:
    - containerPort: 18789
    - containerPort: 18888
    # stage the agent boot in the background the moment the container starts
    lifecycle:
      postStart:
        exec:
          command: ["sh","-c","(nohup openclaw-boot >/tmp/boot.log 2>&1 &)"]
    # READY = the agent inside can answer, not just "container started"
    readinessProbe:
      httpGet:
        path: /healthz
        port: 18888
      periodSeconds: 1
    volumeMounts:
    - mountPath: /home/node/.openclaw
      name: oc-state
    - mountPath: /etc/openclaw
      name: oc-config
    - mountPath: /demo
      name: demo-tools
    - mountPath: /usr/local/bin/openclaw-cli
      name: demo-tools
      subPath: openclaw-cli
    - mountPath: /usr/local/bin/openclaw-boot
      name: demo-tools
      subPath: openclaw-boot
  volumes:
  - name: oc-state
    emptyDir: {}
  - name: oc-config
    configMap:
      name: oc-anthropic-config
  - name: demo-tools
    configMap:
      name: demo-tools
      defaultMode: 0755
