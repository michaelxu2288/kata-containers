apiVersion: v1
kind: Pod
metadata:
  name: fruit-stand
  labels:
    app: fruit-stand
spec:
  nodeName: aks-nodepool1-48531884-vmss000000
  restartPolicy: Always
  containers:
  - name: chatroom
    image: docker.io/library/golang:1.22
    imagePullPolicy: IfNotPresent
    # cameron's public repo + our 3-file patch overlay (adds a Clear button /api/clear)
    command: ["sh","-c"]
    args:
    - "rm -rf /fs; git clone --depth 1 https://github.com/Camelron/fruit-stand /fs && cp /patch/main.go /fs/main.go && cp /patch/index.html /fs/static/index.html && cp /patch/app.js /fs/static/app.js && cd /fs && PORT=8080 go run ."
    volumeMounts:
    - name: patch
      mountPath: /patch
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 3
  volumes:
  - name: patch
    configMap:
      name: fruit-stand-patch
---
apiVersion: v1
kind: Service
metadata:
  name: fruit-stand
  annotations:
    # same mechanism cameron used: public LB + azure dns label
    # -> http://fruits-demo-mx.northeurope.cloudapp.azure.com
    service.beta.kubernetes.io/azure-dns-label-name: fruits-demo-mx2
spec:
  type: LoadBalancer
  selector:
    app: fruit-stand
  ports:
  - port: 80
    targetPort: 8080
